name: Build and Publish Unlocked Dokploy to GHCR

on:
  push:
    branches:
      - custom-canary
  pull_request:
    branches:
      - custom-canary
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server package
        run: pnpm server:build

      - name: Strict TypeScript Typecheck
        run: pnpm typecheck

      - name: Run Unit Tests
        run: pnpm --filter=dokploy test

  docker-amd:
    needs: [quality-gate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare production environment file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Build and push AMD64 image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker buildx build \
            --platform linux/amd64 \
            --file ./Dockerfile \
            --tag ghcr.io/${REPO_LOWER}:amd64-latest \
            --push .

  docker-arm:
    needs: [quality-gate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare production environment file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Build and push ARM64 image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker buildx build \
            --platform linux/arm64 \
            --file ./Dockerfile \
            --tag ghcr.io/${REPO_LOWER}:arm64-latest \
            --push .

  create-multiarch-manifest:
    needs: [docker-amd, docker-arm]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          VERSION=$(node -p "require('./apps/dokploy/package.json').version")

          docker buildx imagetools create \
            -t ghcr.io/${REPO_LOWER}:latest \
            -t ghcr.io/${REPO_LOWER}:canary \
            -t ghcr.io/${REPO_LOWER}:${VERSION} \
            ghcr.io/${REPO_LOWER}:amd64-latest \
            ghcr.io/${REPO_LOWER}:arm64-latest
